name: staffet

services:

  nginx:
    build:
      context: ./docker/nginx
    volumes:
      - ./:/var/www/staffet
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    ports:
      - "80:80"

  php-fpm:
    build:
      context: ./docker/php-fpm
    volumes:
      - ./:/var/www/staffet
    container_name: ${COMPOSE_PROJECT_NAME}-fpm
    environment:
          XDEBUG_CONFIG: "client_host=host.docker.internal"
          PHP_IDE_CONFIG: "serverName=Docker"

  php-cli:
    build:
      context: ./docker/php-cli
    env_file:
      - ./docker/.env.docker
    volumes:
      - ./:/var/www/staffet
    container_name: ${COMPOSE_PROJECT_NAME}-cli
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal"
      PHP_IDE_CONFIG: "serverName=Docker"

  postgres:
    image: postgres:17
    env_file:
      - ./docker/.env.docker
    volumes:
      - ./docker/db_data:/var/lib/postgresql/data:rw
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
        test:
            - CMD-SHELL
            - pg_isready -d "$${POSTGRES_DB:-postgres}" -U "$${POSTGRES_USER:-postgres}"
        timeout: 5s
        retries: 5
        start_period: 60s
# Переменные подхватываются автоматически по имени из .env.docker
#    environment:
#      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
#      - "POSTGRES_DB=${POSTGRES_DB}"
